<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF4A" />
      <stop offset="100%" stop-color="#30D158" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <rect width="512" height="512" rx="120" fill="none" stroke="#27272a" stroke-width="4" />
  
  <circle cx="256" cy="256" r="170" fill="none" stroke="#222" stroke-width="26" stroke-linecap="round" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accent)" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="1068" stroke-dashoffset="300" filter="url(#glow)" />

  <g transform="translate(156, 156) scale(0.39)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <line x1="140" y1="256" x2="372" y2="256" stroke="#ffffff" stroke-width="32" />
    <rect x="90" y="160" width="50" height="192" rx="16" fill="#E2FF4A" stroke="#E2FF4A" />
    <rect x="36" y="196" width="44" height="120" rx="12" fill="#30D158" stroke="#30D158" />
    <rect x="372" y="160" width="50" height="192" rx="16" fill="#E2FF4A" stroke="#E2FF4A" />
    <rect x="432" y="196" width="44" height="120" rx="12" fill="#30D158" stroke="#30D158" />
  </g>
</svg>

